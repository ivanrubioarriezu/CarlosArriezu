<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Firma de correo — Carlos Arriezu</title>
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        background: #f2f4f7;
        color: #202a38;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 32px;
        background: #fff;
      }
      h1 {
        margin: 0 0 10px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 27px;
        font-weight: 400;
      }
      p {
        margin: 0 0 20px;
        color: #465365;
        font-size: 15px;
        line-height: 1.55;
      }
      button {
        margin: 0 0 24px;
        padding: 11px 17px;
        border: 0;
        background: #17263a;
        color: #fff;
        cursor: pointer;
        font: 700 14px Arial, Helvetica, sans-serif;
      }
      button:focus-visible {
        outline: 3px solid #c39a4a;
        outline-offset: 3px;
      }
      #copy-status {
        min-height: 22px;
        margin: -14px 0 24px;
        color: #35465a;
        font-size: 13px;
      }
      .signature-wrap {
        overflow-x: auto;
        padding: 22px;
        border: 1px solid #e4e8ed;
        background: #fff;
      }
      @media (max-width: 520px) {
        body { padding: 16px 10px; }
        main { padding: 22px 16px; }
        .signature-wrap { padding: 14px 8px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Firma de correo</h1>
      <p>Pulsa el botón y pega la firma en Gmail. Si el botón no copia el formato, selecciona la firma con el ratón, cópiala y pégala igualmente.</p>
      <button id="copy-button" type="button">Copiar firma</button>
      <p id="copy-status" role="status" aria-live="polite"></p>

      <div class="signature-wrap">
        <div id="signature">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#17263a;">
            <tbody>
              <tr>
                <td valign="middle" style="padding:0 20px 0 0;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="76" height="76" style="width:76px;height:76px;border-collapse:collapse;background-color:#17263a;">
                    <tbody>
                      <tr>
                        <td align="center" valign="middle" style="font-family:Georgia,'Times New Roman',serif;font-size:29px;line-height:32px;letter-spacing:-2px;color:#f8f6f0;">
                          <a href="https://www.carlosarriezu.com" style="color:#f8f6f0;text-decoration:none;">CA</a>
                        </td>
                      </tr>
                      <tr>
                        <td align="center" style="padding:0 13px 12px;">
                          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="50" style="width:50px;border-collapse:collapse;">
                            <tbody>
                              <tr>
                                <td width="10" height="3" style="width:10px;height:3px;background-color:#d6aa57;font-size:0;line-height:0;">&nbsp;</td>
                                <td width="3" style="width:3px;font-size:0;line-height:0;">&nbsp;</td>
                                <td width="10" style="width:10px;background-color:#d6aa57;font-size:0;line-height:0;">&nbsp;</td>
                                <td width="3" style="width:3px;font-size:0;line-height:0;">&nbsp;</td>
                                <td width="10" style="width:10px;background-color:#d6aa57;font-size:0;line-height:0;">&nbsp;</td>
                                <td width="3" style="width:3px;font-size:0;line-height:0;">&nbsp;</td>
                                <td width="11" style="width:11px;background-color:#d6aa57;font-size:0;line-height:0;">&nbsp;</td>
                              </tr>
                            </tbody>
                          </table>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </td>
                <td valign="middle" style="padding:1px 0 1px 19px;border-left:2px solid #d6aa57;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tbody>
                      <tr>
                        <td style="padding:0 0 3px;font-family:Georgia,'Times New Roman',serif;font-size:23px;line-height:28px;letter-spacing:-.3px;color:#17263a;">
                          Carlos Arriezu
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:0 0 11px;font-size:12px;line-height:17px;letter-spacing:1.2px;text-transform:uppercase;color:#586579;">
                          Músico · artista
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:0 0 5px;font-size:13px;line-height:18px;">
                          <a href="mailto:music@carlosarriezu.com" style="color:#17263a;text-decoration:none;">music@carlosarriezu.com</a>
                          <span style="color:#d6aa57;">&nbsp; | &nbsp;</span>
                          <a href="https://www.carlosarriezu.com" style="color:#17263a;text-decoration:none;">carlosarriezu.com</a>
                        </td>
                      </tr>
                      <tr>
                        <td style="font-size:12px;line-height:18px;">
                          <a href="https://www.instagram.com/arriezuvera/" style="color:#586579;text-decoration:none;">Instagram</a>
                          <span style="color:#d6aa57;">&nbsp; · &nbsp;</span>
                          <a href="https://open.spotify.com/artist/3ZbHQK7iHlDEze8TDJu1R4" style="color:#586579;text-decoration:none;">Spotify</a>
                          <span style="color:#d6aa57;">&nbsp; · &nbsp;</span>
                          <a href="https://www.youtube.com/channel/UCSQYA4C9QLe2-wSVkn-sY4Q" style="color:#586579;text-decoration:none;">YouTube</a>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      const button = document.getElementById('copy-button');
      const signature = document.getElementById('signature');
      const status = document.getElementById('copy-status');

      button.addEventListener('click', () => {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(signature);
        selection.removeAllRanges();
        selection.addRange(range);

        let copied = false;
        try {
          copied = document.execCommand('copy');
        } finally {
          selection.removeAllRanges();
        }

        status.textContent = copied
          ? 'Firma copiada. Ya puedes pegarla en Gmail.'
          : 'No se pudo copiar automáticamente. Selecciona la firma, cópiala y pégala en Gmail.';
      });
    </script>
  </body>
</html>
